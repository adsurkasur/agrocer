<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Smart Farming Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eeeeee;
        }

    </style>

</head>

<body>

    <h1>Smart Farming Dashboard</h1>

    <div class="card">

        <canvas id="sensorChart"></canvas>

    </div>

    <div class="card">

        <table>

            <thead>

                <tr>
                    <th>No</th>
                    <th>Timestamp</th>
                    <th>Temp (°C)</th>
                    <th>Humidity (%)</th>
                    <th>Lux (lx)</th>
                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script>

        const ctx = document.getElementById('sensorChart');

        const sensorChart = new Chart(ctx, {

            type: 'line',

            data: {

                labels: [],

                datasets: [

                    {
                        label: 'Temperature (°C)',
                        data: [],
                        tension: 0.3
                    },

                    {
                        label: 'Humidity (%)',
                        data: [],
                        tension: 0.3
                    },

                    {
                        label: 'Lux (lx)',
                        data: [],
                        tension: 0.3
                    }

                ]
            },

            options: {

                responsive: true,

                animation: false,

                scales: {

                    y: {
                        beginAtZero: true
                    }
                }
            }
        });


        async function updateDashboard() {

            const response = await fetch('/api/latest');

            const data = await response.json();

            // =========================
            // UPDATE TABLE
            // =========================

            const tableBody = document.getElementById('tableBody');

            tableBody.innerHTML = '';

            data.forEach(row => {

                tableBody.innerHTML += `
                    <tr>
                        <td>${row.id}</td>
                        <td>${row.timestamp}</td>
                        <td>${row.temperature}</td>
                        <td>${row.humidity}</td>
                        <td>${row.lux}</td>
                    </tr>
                `;
            });


            // =========================
            // UPDATE CHART
            // =========================

            sensorChart.data.labels =
                data.map(row => row.timestamp);

            sensorChart.data.datasets[0].data =
                data.map(row => row.temperature);

            sensorChart.data.datasets[1].data =
                data.map(row => row.humidity);

            sensorChart.data.datasets[2].data =
                data.map(row => row.lux);

            sensorChart.update();
        }


        // LOAD AWAL
        updateDashboard();

        // REALTIME PER 1 DETIK
        setInterval(updateDashboard, 1000);

    </script>

</body>
</html>
