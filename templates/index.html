<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Smart Farming Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 10px;
        }

        #liveTime {
            margin-bottom: 30px;
            color: #666;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eeeeee;
        }

        tbody tr:nth-child(even) {
            background: #fafafa;
        }

    </style>

</head>

<body>

    <h1>Smart Farming Dashboard</h1>

    <p id="liveTime"></p>

    <div class="chart-grid">

        <!-- ========================= -->
        <!-- TEMPERATURE -->
        <!-- ========================= -->
        <div class="card">

            <h2>Temperature</h2>

            <canvas id="tempChart"></canvas>

        </div>

        <!-- ========================= -->
        <!-- HUMIDITY -->
        <!-- ========================= -->
        <div class="card">

            <h2>Humidity</h2>

            <canvas id="humChart"></canvas>

        </div>

        <!-- ========================= -->
        <!-- LUX -->
        <!-- ========================= -->
        <div class="card">

            <h2>Light Intensity</h2>

            <canvas id="luxChart"></canvas>

        </div>

    </div>

    <!-- ========================= -->
    <!-- TABLE -->
    <!-- ========================= -->
    <div class="card">

        <table>

            <thead>

                <tr>
                    <th>No</th>
                    <th>Timestamp</th>
                    <th>Temp (°C)</th>
                    <th>Humidity (%)</th>
                    <th>Lux (lx)</th>
                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script>

        // =========================
        // TEMPERATURE CHART
        // =========================
        const tempChart = new Chart(
            document.getElementById('tempChart'),
            {

                type: 'line',

                data: {

                    labels: [],

                    datasets: [
                        {
                            label: 'Temperature (°C)',
                            data: [],
                            tension: 0.3,

                            borderColor: '#36A2EB',
                            backgroundColor: 'rgba(54,162,235,0.2)',

                            fill: true
                        }
                    ]
                },

                options: {

                    responsive: true,

                    animation: false,

                    scales: {
                        y: {
                            min: 20,
                            max: 40
                        }
                    }
                }
            }
        );


        // =========================
        // HUMIDITY CHART
        // =========================
        const humChart = new Chart(
            document.getElementById('humChart'),
            {

                type: 'line',

                data: {

                    labels: [],

                    datasets: [
                        {
                            label: 'Humidity (%)',
                            data: [],
                            tension: 0.3,

                            borderColor: '#FF6384',
                            backgroundColor: 'rgba(255,99,132,0.2)',

                            fill: true
                        }
                    ]
                },

                options: {

                    responsive: true,

                    animation: false,

                    scales: {
                        y: {
                            min: 0,
                            max: 100
                        }
                    }
                }
            }
        );


        // =========================
        // LUX CHART
        // =========================
        const luxChart = new Chart(
            document.getElementById('luxChart'),
            {

                type: 'line',

                data: {

                    labels: [],

                    datasets: [
                        {
                            label: 'Lux (lx)',
                            data: [],
                            tension: 0.3,

                            borderColor: '#FF9F40',
                            backgroundColor: 'rgba(255,159,64,0.2)',

                            fill: true
                        }
                    ]
                },

                options: {

                    responsive: true,

                    animation: false,

                    scales: {
                        y: {
                            min: 0,
                            max: 200
                        }
                    }
                }
            }
        );


        // =========================
        // UPDATE DASHBOARD
        // =========================
        async function updateDashboard() {

            const response = await fetch('/api/latest');

            const data = await response.json();

            // =========================
            // UPDATE TABLE
            // =========================
            const tableBody = document.getElementById('tableBody');

            tableBody.innerHTML = '';

            [...data].reverse().forEach(row => {

                tableBody.innerHTML += `
                    <tr>
                        <td>${row.id}</td>
                        <td>${row.timestamp}</td>
                        <td>${row.temperature}</td>
                        <td>${row.humidity}</td>
                        <td>${row.lux}</td>
                    </tr>
                `;
            });


            // =========================
            // LABELS
            // =========================
            const labels =
                data.map(row =>
                    row.timestamp.split(" ")[1]
                );


            // =========================
            // TEMPERATURE
            // =========================
            tempChart.data.labels = labels;

            tempChart.data.datasets[0].data =
                data.map(row => row.temperature);

            tempChart.update();


            // =========================
            // HUMIDITY
            // =========================
            humChart.data.labels = labels;

            humChart.data.datasets[0].data =
                data.map(row => row.humidity);

            humChart.update();


            // =========================
            // LUX
            // =========================
            luxChart.data.labels = labels;

            luxChart.data.datasets[0].data =
                data.map(row => row.lux);

            luxChart.update();
        }


        // =========================
        // LOAD AWAL
        // =========================
        updateDashboard();


        // =========================
        // REALTIME UPDATE
        // =========================
        setInterval(updateDashboard, 1000);


        // =========================
        // LIVE CLOCK
        // =========================
        setInterval(() => {

            const now = new Date();

            document.getElementById("liveTime").innerText =
                "Live Time: " + now.toLocaleTimeString();

        }, 1000);

    </script>

</body>
</html>
